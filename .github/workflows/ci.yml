name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e . pytest ruff
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q
      - name: Wheel contains the templates
        run: |
          python -m pip install build
          python -m build --wheel
          python -c "import glob,zipfile; z=zipfile.ZipFile(glob.glob('dist/*.whl')[0]); n=z.namelist(); assert any(x.endswith('templates/dot-claude/agents/splitter.md') for x in n), n"
