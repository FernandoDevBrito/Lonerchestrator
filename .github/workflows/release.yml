name: Release

# Publishes to PyPI when you push a version tag (git tag v0.1.0 && git push origin v0.1.0).
# One-time setup on pypi.org (no token needed): Your projects > Publishing > add a trusted publisher
#   owner FernandoDevBrito, repository lonerchestrator, workflow release.yml, environment pypi.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: The tag must match the package version
        run: |
          python - <<'PY'
          import os, tomllib
          tag = os.environ["GITHUB_REF_NAME"].lstrip("v")
          ver = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          assert tag == ver, f"tag v{tag} does not match pyproject version {ver}"
          PY
      - name: Build
        run: |
          python -m pip install build
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write          # trusted publishing: PyPI trusts this workflow, no password or token stored
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
