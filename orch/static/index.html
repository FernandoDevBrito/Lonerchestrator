<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>lonerchestrator board</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
  <h1>◆ lonerchestrator <span id="proj" class="pill"></span></h1>
  <span id="pills"></span>
  <span class="sp"></span>
  <span id="runstate" class="pill"><span class="dot" id="dot"></span><span id="runtxt">idle</span></span>
  <button id="run">Run</button>
  <button id="stop">Stop</button>
  <button id="newbtn" class="primary">＋ New request</button>
</header>
<nav id="tabs"></nav>
<div id="problems"></div>
<main id="view"></main>

<dialog id="newbox">
  <h3 style="margin:0 0 4px">New request</h3>
  <div class="ev">Say what you want changed, in plain words. The AI drafts a card (title, goal, testable criteria); the planner asks you if anything is vague.</div>
  <label for="ntext">What do you need?</label>
  <textarea id="ntext" placeholder="e.g. Add a logout button to the header that clears the session and returns to the login page"></textarea>
  <label for="narea">Built by</label>
  <select id="narea"><option value="">auto (the AI decides)</option><option>backend</option><option>frontend</option><option>both</option></select>
  <div class="row">
    <label><input type="checkbox" id="nai" checked> let the AI draft the card</label>
    <label><input type="checkbox" id="nrun" checked> start working now</label>
  </div>
  <div class="row" style="justify-content:flex-end">
    <button id="ncancel">Cancel</button>
    <button id="nsend" class="primary">Create</button>
  </div>
</dialog>

<aside id="drawer"></aside>
<div id="toast"></div>
<script src="/app.js"></script>
</body>
</html>
