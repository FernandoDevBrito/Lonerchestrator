<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="description" content="Local kanban board for lonerchestrator: cards, plans, agents, usage and settings.">
<title>lonerchestrator board</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23c2410c'/%3E%3Cpath d='M9 22V10h4v8h10v4z' fill='white'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<a class="skip" href="#view">Skip to the board</a>
<header>
  <h1>lonerchestrator <span id="proj"></span></h1>
  <span id="pills" aria-label="AIs on this computer"></span>
  <span class="sp"></span>
  <span id="runstate" class="pill mono" role="status"><span class="dot" id="dot"></span><span id="runtxt">connecting</span></span>
  <button id="theme" class="quiet" title="Theme (t)" aria-label="Switch theme">Auto</button>
  <button id="helpbtn" class="quiet" title="Help and shortcuts (?)" aria-label="Help and shortcuts">Help</button>
  <button id="run">Run</button>
  <button id="stop">Stop</button>
  <button id="newbtn" class="primary">New request</button>
</header>
<div class="navwrap"><nav id="tabs" role="tablist" aria-label="Views"></nav></div>
<div id="problems" role="alert"></div>
<div id="filters" class="filters" hidden>
  <input type="search" id="q" placeholder="Filter by title or number   ( / )" aria-label="Filter cards by title or number" autocomplete="off">
  <div class="seg" role="group" aria-label="Filter by area" id="areas"></div>
</div>
<main id="view" tabindex="-1" aria-live="off"></main>

<dialog id="newbox" aria-labelledby="ntitle">
  <h3 id="ntitle" style="margin:0 0 6px;font-size:18px;letter-spacing:-.01em">New request</h3>
  <div class="ev">Say what you want changed, in plain words. The AI drafts a card (title, goal, testable criteria); the planner asks you if anything is vague.</div>
  <label for="ntext">What do you need?</label>
  <textarea id="ntext" placeholder="e.g. Add a logout button to the header that clears the session and returns to the login page"></textarea>
  <label for="narea">Built by</label>
  <select id="narea"><option value="">auto (the AI decides)</option></select>
  <div class="row">
    <label><input type="checkbox" id="nai" checked> let the AI draft the card</label>
    <label><input type="checkbox" id="nrun" checked> start working now</label>
  </div>
  <div class="row" style="justify-content:flex-end">
    <button id="ncancel">Cancel</button>
    <button id="nsend" class="primary">Create</button>
  </div>
</dialog>

<dialog id="helpbox" aria-labelledby="htitle">
  <div class="row" style="margin:0;justify-content:space-between"><h3 id="htitle" style="margin:0;font-size:18px">How it works</h3><button id="hclose" class="quiet">Close</button></div>
  <div id="helpbody"></div>
</dialog>

<div id="scrim"></div>
<aside id="drawer" aria-label="Card details"></aside>
<div id="toast" role="status" aria-live="polite"></div>
<script src="/app.js"></script>
</body>
</html>
