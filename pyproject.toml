[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "lonerchestrator"
version = "0.1.0"
description = "Local multi-agent orchestrator for AI coding agents (Claude Code + Antigravity/Gemini): cards -> plan -> build -> guardrails -> CI -> independent review -> merge"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["ai", "agents", "claude-code", "orchestrator", "tui", "developer-tools"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development",
]
dependencies = []   # standard library only
authors = [{ name = "Nando" }]

[project.urls]
Homepage = "https://github.com/FernandoDevBrito/lonerchestrator"
Source = "https://github.com/FernandoDevBrito/lonerchestrator"
Issues = "https://github.com/FernandoDevBrito/lonerchestrator/issues"
Changelog = "https://github.com/FernandoDevBrito/lonerchestrator/blob/main/CHANGELOG.md"

[project.scripts]
lonerchestrator = "orch.cli:main"

[tool.setuptools]
packages = ["orch"]

[tool.setuptools.package-data]
orch = ["templates/**/*"]

[tool.ruff]
line-length = 140

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
